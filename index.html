<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 90%;
            backdrop-filter: blur(10px);
        }
        h2 { color: #d63384; margin-bottom: 20px; }
        input[type="password"] {
            width: 80%;
            padding: 10px;
            border: 2px solid #ff4b2b;
            border-radius: 25px;
            outline: none;
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { transform: scale(1.05); }
        .content { display: none; }
        .heart { font-size: 50px; color: #ff416c; margin-bottom: 10px; }
        .message { font-size: 18px; color: #333; line-height: 1.6; margin: 15px 0; }
        audio { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card" id="loginCard">
        <div class="heart">❤️</div>
        <h2>جاهزة تشوف الهدايا؟</h2>
        <p style="color: #666; font-size: 14px;">ادخلي كلمة السر للفتح</p>
        <input type="password" id="passInput" placeholder="Password">
        <br>
        <button onclick="checkPassword()">Unlock ✨</button>
        <p id="errorMsg" style="color: red; display: none; font-size: 12px; margin-top: 10px;">كلمة السر غير صحيحة!</p>
    </div>

    <div class="card content" id="contentCard">
        <div class="heart">💖</div>
        <h2>بجد بحبك وربنا يخليكي ليا</h2>
        <p class="message">أنتي أغلى حاجة عندي في الدنيا كلها ❤️</p>
        
        <!-- تشغيل أغنية تامر عاشور (أجمل حلم / قولوله سماح / بحبك) -->
        <audio controls id="myAudio" autoplay loop>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            المتصفح لا يدعم تشغيل الصوت.
        </audio>
    </div>

    <script>
        function checkPassword() {
            const input = document.getElementById('passInput').value.trim().toLowerCase();
            // الباسورد هو سلمى سواء بالعربي أو الإنجليزي
            if (input === 'سلمى' || input === 'سلمي' || input === 'salma') {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('contentCard').style.display = 'block';
                document.getElementById('myAudio').play();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
